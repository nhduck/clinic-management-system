services:
    db:
        image: postgres:16
        restart: unless-stopped
        command: ["postgres", "-p", "${DB_INTERNAL_PORT:-5432}"]
        environment:
            POSTGRES_DB: ${DB_NAME:-phong_kham}
            POSTGRES_USER: ${DB_USER:-pk_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-pk_password}}
            PGPORT: ${DB_INTERNAL_PORT:-5432}
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        ports:
            - "127.0.0.1:${DB_PORT:-5432}:${DB_INTERNAL_PORT:-5432}"
        volumes:
            - clinic_pgdata:/var/lib/postgresql/data
            - ./server/db:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 5s
            timeout: 3s
            retries: 15
            start_period: 10s

    server:
        build:
            context: .
            dockerfile: server/Dockerfile
        restart: unless-stopped
        environment:
            PORT: ${SERVER_INTERNAL_PORT:-8080}
            DB_HOST: ${DB_HOST:-db}
            DB_INTERNAL_PORT: ${DB_INTERNAL_PORT:-5432}
            DB_NAME: ${DB_NAME:-phong_kham}
            DB_USER: ${DB_USER:-pk_user}
            DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-pk_password}}
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        ports:
            - "127.0.0.1:${SERVER_PORT:-8081}:${SERVER_INTERNAL_PORT:-8080}"
        depends_on:
            db:
                condition: service_healthy

    client:
        build:
            context: .
            dockerfile: client/Dockerfile
        restart: unless-stopped
        environment:
            CLIENT_INTERNAL_PORT: ${CLIENT_INTERNAL_PORT:-80}
            API_HOST: server
            API_PORT: ${SERVER_INTERNAL_PORT:-8080}
            NGINX_ENVSUBST_FILTER: "^(CLIENT_INTERNAL_PORT|API_HOST|API_PORT)$$"
            TZ: ${TZ:-Asia/Ho_Chi_Minh}
        ports:
            - "${CLIENT_PORT:-${APP_PORT:-8080}}:${CLIENT_INTERNAL_PORT:-80}"
        depends_on:
            - server
        healthcheck:
            test:
                ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$CLIENT_INTERNAL_PORT/health"]
            interval: 10s
            timeout: 3s
            retries: 6
            start_period: 5s

volumes:
    clinic_pgdata:
