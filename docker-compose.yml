
services:
  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: phong_kham
      POSTGRES_USER: pk_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pk_password}
      TZ: Asia/Ho_Chi_Minh

    volumes:
      - clinic_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U pk_user -d phong_kham
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/phong_kham
      DB_USER: pk_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pk_password}
      TZ: Asia/Ho_Chi_Minh

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - java
        - -cp
        - /app/clinic.jar
        - clinic.HealthCheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  clinic_pgdata:
