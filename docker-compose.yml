services:
  db:
    image: postgres:16
    container_name: clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: phong_kham
      POSTGRES_USER: pk_user
      POSTGRES_PASSWORD: pk_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - clinic_pgdata:/var/lib/postgresql/data
      # Các file *.sql trong thư mục này chỉ chạy MỘT LẦN, khi volume còn trống.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pk_user -d phong_kham"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clinic_pgdata:
